name: Build boring.notch (AI Agent)

on:
  workflow_dispatch:
  push:
    branches:
      - feature/ai-agent-control

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Build boringNotch (unsigned)
        run: |
          set -euo pipefail
          xcodebuild -target boringNotch -configuration Release \
            -destination 'generic/platform=macOS' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="-" \
            DEVELOPMENT_TEAM="" \
            ONLY_ACTIVE_ARCH=NO \
            BUILD_DIR="$PWD/build" \
            clean build 2>&1 | tee build.log

      - name: Verify executable exists
        run: |
          set -euo pipefail
          BIN="build/Release/boringNotch.app/Contents/MacOS/boringNotch"
          if [ ! -f "$BIN" ]; then
            echo "::error::Built .app is missing its executable at $BIN"
            echo "== build/Release listing =="
            ls -la "build/Release/" || true
            echo "== MacOS folder =="
            ls -la "build/Release/boringNotch.app/Contents/MacOS/" || true
            exit 1
          fi
          echo "Executable OK: $(stat -f%z "$BIN") bytes"

      - name: Debug build output
        if: success()
        run: |
          echo "== any .app under build =="
          find build -maxdepth 4 -type d -name "*.app" 2>/dev/null
          echo "== build/Release listing =="
          ls -la "build/Release/" 2>/dev/null
          echo "== executable anywhere =="
          find . -type f -name "boringNotch" 2>/dev/null | head
          echo "== BUILT_PRODUCTS_DIR =="
          xcodebuild -target boringNotch -configuration Release -showBuildSettings 2>/dev/null | grep -E "BUILT_PRODUCTS_DIR|TARGET_BUILD_DIR|EXECUTABLE_PATH" | head

      - name: Ad-hoc codesign (so embedded frameworks pass library validation)
        if: success()
        run: |
          set -euo pipefail
          codesign --force --deep --sign - "build/Release/boringNotch.app"
          codesign --verify --verbose=2 "build/Release/boringNotch.app" || true

      - name: Package app as zip (preserves bundle)
        if: success()
        run: |
          ditto -c -k --keepParent "build/Release/boringNotch.app" "boringNotch-ai.zip"
          echo "::group::zip contents (key files)"
          unzip -l boringNotch-ai.zip | grep -E "MacOS/|Contents/Info.plist" | head
          echo "::endgroup::"

      - name: Upload app artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: boringNotch-ai
          path: boringNotch-ai.zip
          retention-days: 30

      - name: Summarize build errors
        if: failure()
        run: |
          echo "::group::Build errors"
          grep -E "error:" build.log | head -50 || true
          echo "::endgroup::"
