name: Build boring.notch (AI Agent)

on:
  workflow_dispatch:
  push:
    branches:
      - feature/ai-agent-control

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Build boringNotch (unsigned)
        run: |
          xcodebuild -target boringNotch -configuration Release \
            -destination 'generic/platform=macOS' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="-" \
            DEVELOPMENT_TEAM="" \
            ONLY_ACTIVE_ARCH=NO \
            BUILD_DIR="$PWD/build" \
            clean build 2>&1 | tee build.log

      - name: Debug build output
        if: success()
        run: |
          echo "== find boringNotch executables =="
          find build -type f -name "boringNotch" 2>/dev/null
          echo "== MacOS dir =="
          ls -la "build/Release/boringNotch.app/Contents/MacOS/" 2>/dev/null
          echo "== app Contents =="
          ls -la "build/Release/boringNotch.app/Contents/" 2>/dev/null

      - name: Package app as zip (preserves bundle)
        if: success()
        run: |
          ditto -c -k --keepParent "build/Release/boringNotch.app" "boringNotch-ai.zip"
          echo "::group::zip contents (key files)"
          unzip -l boringNotch-ai.zip | grep -E "MacOS/|Contents/Info.plist" | head
          echo "::endgroup::"

      - name: Upload app artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: boringNotch-ai
          path: boringNotch-ai.zip
          retention-days: 30

      - name: Summarize build errors
        if: failure()
        run: |
          echo "::group::Build errors"
          grep -E "error:" build.log | head -50 || true
          echo "::endgroup::"
